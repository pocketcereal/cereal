version: "3"

tasks:
  dev:
    cmds:
      - uv run cereal --overlays

  detections:
    cmds:
      - uv run cereal detections --limit 20

  agent-smoke:
    cmds:
      - uv run cereal --agent orchestrator

  detection-lookup-smoke:
    cmds:
      - uv run cereal --agent detection-lookup

  orchestrator-delegation-smoke:
    cmds:
      - uv run cereal --agent orchestrator-delegation

  visual-query-planning-smoke:
    cmds:
      - uv run cereal --agent visual-query-planning

  lint:
    cmds:
      - uv run ruff format --check
      - uv run ruff check

  test:
    cmds:
      - uv run pytest

  check:
    cmds:
      - task: lint
      - uv run ty check
      - task: test
