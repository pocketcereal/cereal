version: "3"

tasks:
  dev:
    cmds:
      - uv run cereal --overlays

  detections:
    cmds:
      - uv run cereal detections --limit 20

  agent-smoke:
    cmds:
      - uv run cereal --agent orchestrator

  lint:
    cmds:
      - uv run ruff format --check
      - uv run ruff check

  test:
    cmds:
      - uv run pytest

  check:
    cmds:
      - task: lint
      - uv run ty check
      - task: test
