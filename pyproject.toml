[project]
name = "cereal"
version = "0.1.0"
description = "Cereal command-line tool"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.6.6",
    "langchain-ollama>=1.1.0",
    "opencv-python>=4.13.0.92",
    "pydantic-settings[yaml]>=2.14.1",
    "ultralytics>=8.4.55",
]

[project.scripts]
cereal = "cereal.cli:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "ty>=0.0.38",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
# Tests document intent through their function names and AAA structure;
# pydocstyle (D101/D102/D103/D107) and assert-use (S101) are intentional
# allowances rather than blanket suppressions of strict ruff "ALL".
"tests/**/*.py" = ["D101", "D102", "D103", "D107", "S101"]

[tool.ty.rules]
all = "error"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
markers = [
    "slow: opt-in tests that load real models or external resources",
]
